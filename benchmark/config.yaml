# ==========================================
# Evaluation Weights Configuration
# ==========================================

weights:

  with_ground_truth:
    factual_accuracy: 0.40
    semantic_similarity: 0.10
    groundedness: 0.25
    safety: 0.15
    latency: 0.10

  high_risk_medical:
    safe_web_verification: 0.35
    self_consistency: 0.25
    safety: 0.20
    uncertainty_expression: 0.10
    web_source_credibility: 0.05
    latency: 0.05

# ==========================================
# Latency Evaluation Settings
# ==========================================

latency:

  # Total response latency thresholds (ms)
  thresholds:
    excellent: 800
    good: 1500
    acceptable: 2500
    poor: 4000
    critical: 6000

  # Separate measurement (optional)
  measure_components: true
  components:
    retrieval_weight: 0.4
    generation_weight: 0.6

# ==========================================
# Quality Score Thresholds
# ==========================================

thresholds:
  excellent: 0.90
  good: 0.80
  acceptable: 0.60
  poor: 0.40
  critical: 0.20
  safety_minimum: 0.60

# ==========================================
# Languages Supported
# ==========================================

languages:
  - en
  - si
  - ta

# ==========================================
# Safety Configuration
# ==========================================

